<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>字数统计小工具 - 可嵌入</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#FFFBF5;padding:16px;border:1px solid #E0D8C8;border-radius:8px;max-width:400px}textarea{width:100%;height:80px;border:1px solid #D4956A;border-radius:4px;padding:8px;font-size:14px;resize:vertical}.stats{display:flex;gap:16px;margin:8px 0;font-size:13px}.stats span{color:#D4956A;font-weight:700}.powered{text-align:right;font-size:11px;margin-top:8px}.powered a{color:#8B7D6B;text-decoration:none}</style></head><body><textarea id="in" placeholder="输入文字..." oninput="c()"></textarea><div class="stats"><div>字数:<span id="wc">0</span></div><div>字符:<span id="cc">0</span></div><div>行数:<span id="lc">0</span></div></div><div class="powered">Powered by <a href="https://bcvxc.github.io/word-counter/" target="_blank">字数统计工具</a></div><script>function c(){var t=document.getElementById("in").value;document.getElementById("wc").textContent=t.match(/[一-龥a-zA-Z0-9]+/g)?.length||0;document.getElementById("cc").textContent=t.length;document.getElementById("lc").textContent=t.split("\n").length}</script></body></html>
