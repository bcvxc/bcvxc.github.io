body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
header{text-align:center;padding:40px 0 36px}

footer{text-align:center;padding:40px 0 16px;font-size:12px;color:var(--muted);line-height:1.8}
footer a{color:var(--accent);text-decoration:none}
